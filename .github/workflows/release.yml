# Releases one n8n community node package: computes the next version, stages it
# on npm with a provenance attestation, and tags the release on GitHub.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. Provenance is generated
# automatically when publishing through npm Trusted Publishing (OIDC).
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# 1. Actions → Release → Run workflow, then select the package and the version
#    bump (or enter an explicit version). From another system:
#
#      gh workflow run release.yml -f package=<package> -f bump=patch
#
# 2. The workflow stages the package with `npm stage publish`. A maintainer
#    reviews and approves it with 2FA on npmjs.com (Staged Packages tab) or with
#    `npm stage approve <id>`. Only then is the version public.
# 3. Publish the draft GitHub release "<package>-v<version>".
#
# The version is not stored in the repository: package.json contains a
# placeholder, and the version is set only in the build. The tag is created
# after the package was staged successfully. If the staged version is rejected
# on npm, delete the tag and the draft release.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# For each package on npmjs.com: Settings → Trusted Publisher → GitHub Actions,
# with this repository and the workflow name "release.yml". Do not allow
# `npm publish`, so that every release needs an approval. Optionally set
# Publishing access to "Require two-factor authentication and disallow tokens".

name: Release

run-name: Release ${{ inputs.package }} (${{ inputs.version || inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory to release
        type: choice
        required: true
        options:
          - ickv
          - iff
      bump:
        description: Version bump based on the latest released version
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: Explicit version such as 1.0.0 (optional, overrides the bump)
        type: string
        required: false

permissions:
  # Required to mint an OIDC token for npm provenance attestation.
  id-token: write
  # Required to push the tag and create the GitHub release.
  contents: write

concurrency:
  group: release-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.package }}
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch
    env:
      PACKAGE: ${{ inputs.package }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          package-manager-cache: false

      - name: Update npm
        # Staged publishing requires npm 11.15.0 or later.
        run: npm install -g npm@latest

      - name: Determine version
        id: version
        working-directory: ${{ inputs.package }}
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: |
          name="$(node -p "require('./package.json').name")"
          if [ -n "$EXPLICIT_VERSION" ]; then
            if ! [[ "$EXPLICIT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::The version '$EXPLICIT_VERSION' is not of the form MAJOR.MINOR.PATCH."
              exit 1
            fi
            version="$EXPLICIT_VERSION"
          else
            latest_tag="$(git tag --list "$PACKAGE-v*" | sed "s/^$PACKAGE-v//" | sort -V | tail -n1)"
            latest_npm="$(npm view "$name" version 2>/dev/null || true)"
            latest="$(printf '%s\n' 0.0.0 "$latest_tag" "$latest_npm" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
            IFS=. read -r major minor patch <<< "$latest"
            case "$BUMP" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              *) version="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
            echo "::error::$name@$version is already published on npm."
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$PACKAGE-v$version" > /dev/null; then
            echo "::error::The tag '$PACKAGE-v$version' already exists."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $name@$version"

      - name: Install dependencies
        working-directory: ${{ inputs.package }}
        run: npm ci

      - name: Set version
        working-directory: ${{ inputs.package }}
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --workspaces=false --allow-same-version

      - name: Lint and build
        working-directory: ${{ inputs.package }}
        run: |
          npm run lint
          npm run build

      - name: Stage package on npm
        # The package becomes public only after a maintainer approves it on npm.
        # RELEASE_MODE satisfies the n8n-node prepublish guard.
        working-directory: ${{ inputs.package }}
        env:
          RELEASE_MODE: 'true'
        run: npm stage publish

      - name: Tag and create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="$PACKAGE-v$VERSION"
          previous="$(git tag --list "$PACKAGE-v*" | sort -V | tail -n1)"
          git tag "$tag"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --draft --title "$PACKAGE $VERSION" --generate-notes --verify-tag ${previous:+--notes-start-tag "$previous"}
          {
            echo "### $PACKAGE $VERSION staged"
            echo "Approve it on npmjs.com (Staged Packages) and then publish the draft GitHub release."
          } >> "$GITHUB_STEP_SUMMARY"
